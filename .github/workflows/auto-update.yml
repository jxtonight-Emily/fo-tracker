name: Auto Update FO Tracker
on:
  schedule:
    - cron: '0 1 * * 5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'EOF'
          import os, json, re, urllib.request
          src = "index.html" if os.path.exists("index.html") else "family_office_dashboard.html"
          html = open(src, encoding="utf-8").read()
          m = re.search(r"const REPORT_DATA\s*=\s*(\{[\s\S]*?\n\s*\});", html)
          tpl = m.group(1) if m else "{}"
          key = os.environ["GEMINI_API_KEY"]
          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={key}"
          prompt = "Search latest CNBC Family Office Portfolio Tracker by Addepar. Return ONLY valid JSON matching exact keys of template updated with latest quarter numbers:\n" + tpl
          payload = json.dumps({"contents": [{"parts": [{"text": prompt}]}], "tools": [{"google_search": {}}]}).encode()
          req = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json"})
          res = json.loads(urllib.request.urlopen(req).read().decode())
          txt = res["candidates"][0]["content"]["parts"][0]["text"]
          jm = re.search(r"\{[\s\S]*\}", txt)
          if jm and m:
              new_html = html[:m.start(1)] + jm.group(0) + html[m.end(1):]
              open("index.html", "w", encoding="utf-8").write(new_html)
          EOF
      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update" && git push)
